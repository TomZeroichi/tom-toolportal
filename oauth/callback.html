<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eBay連携を完了しています…</title><style>body{min-height:100vh;display:grid;place-items:center;margin:0;background:#f4f8ff;color:#102a4b;font-family:system-ui,sans-serif}main{max-width:520px;margin:24px;padding:30px;border-radius:18px;background:#fff;text-align:center;box-shadow:0 12px 40px #163b6618}h1{font-size:22px}.bad{color:#bf3030}.ok{color:#00895a}</style><main><h1 id="title">eBay連携を完了しています…</h1><p id="message">TOMへ認可情報を安全に引き渡しています。</p></main><script>(()=>{const q=new URLSearchParams(location.search),code=q.get("code"),state=q.get("state"),error=q.get("error"),error_description=q.get("error_description"),t=document.querySelector("#title"),m=document.querySelector("#message");if(error||!code||!state){t.textContent="eBay連携を完了できませんでした";t.className="bad";m.textContent=error_description||error||"認可情報を受け取れませんでした。TOM画面からもう一度お試しください。";return}t.textContent="eBayの許可を受け取りました";t.className="ok";if(window.opener){window.opener.postMessage({type:"tom-ebay-oauth-code",code,state,error,error_description},"*");setTimeout(()=>window.close(),900)}else m.textContent="この画面を閉じ、TOMの連携画面へ戻ってください。"})();</script>
