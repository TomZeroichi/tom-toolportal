<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOM 古物商申請アシスト</title><div id="loading" style="font-family:sans-serif;padding:40px;text-align:center">申請画面を読み込んでいます…</div><script>(async()=>{try{const base="https://raw.githubusercontent.com/TomZeroichi/tom-toolportal/main/kobutsu/";const names=['cloud_v012_1.txt','cloud_v012_2.txt','cloud_v012_3.txt','cloud_v012_4.txt','cloud_v012_5.txt'];const parts=await Promise.all(names.map(n=>fetch(base+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const bin=Uint8Array.from(atob(parts.join('').trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();txt=txt.replaceAll('TOM 古物商申請アシスト v0.12','TOM 古物商申請アシスト v0.13');txt=txt.replaceAll('v0.11ではスマホの入力内容をPCへ自動同期します。','スマホの入力内容はクラウドへ自動同期され、PCのExcel/PDF作成へ反映されます。');txt=txt.replaceAll('元の3ページWordへ反映してPDFを作成します。','固定Excelテンプレートへ反映してPDFを作成します。');txt=txt.replaceAll('元の3ページWordへ反映し、Microsoft WordからPDF化します。','固定Excelテンプレートへ反映し、Microsoft ExcelからPDF化します。');txt=txt.replaceAll('Wordへ反映','Excelへ反映');document.open();document.write(txt);document.close()}catch(e){document.getElementById('loading').textContent='申請画面を読み込めませんでした。再読み込みしてください。';console.error(e)}})();</script>
