turn'';if(byCode[s])return byCode[s];if(byCode[s.padStart(2,'0')])return byCode[s.padStart(2,'0')];for(const c of cats.sort((a,b)=>b.length-a.length))if(s.includes(c))return c;return''}function cur(){try{return og(fixKey)||''}catch{return''}}function set(v){const c=canon(v);if(c){try{os(fixKey,c)}catch{};window.__tomMainCategory=c;return c}return''}function cleanErr(arr){return Array.isArray(arr)?arr.filter(e=>!/主として取り扱う古物|主たる区分/.test(JSON.stringify(e))):arr}function patchObj(o,v=cur()){if(!o||typeof o!=='object'||!v)return o;try{if(o.payload&&o.payload.state&&o.payload.state.data)o.payload.state.data.mainCategory=v;if(o.state&&o.state.data)o.state.data.mainCategory=v;if(o.data&&typeof o.data==='object'&&(Array.isArray(o.data.categories)||'mainCategory'in o.data))o.data.mainCategory=v;if('mainCategory'in o)o.mainCategory=v;if(o.validation&&Array.isArray(o.validation.errors))o.validation.errors=cleanErr(o.validation.errors);if(Array.isArray(o.errors))o.errors=cleanErr(o.errors)}catch{}return o}const rawGet=Storage.prototype.getItem,rawSet=Storage.prototype.setItem;Storage.prototype.getItem=function(k){const r=rawGet.call(this,k);if(!r||String(k).startsWith('tom_kobutsu_mainCategory_fix_'))return r;const v=cur();if(!v||r[0]!=='{')return r;try{const o=JSON.parse(r);patchObj(o,v);return JSON.stringify(o)}catch{return r}};Storage.prototype.setItem=function(k,v){if(!String(k).startsWith('tom_kobutsu_mainCategory_fix_')&&typeof v==='string'&&v[0]==='{'){const mv=cur();if(mv)try{const o=JSON.parse(v);patchObj(o,mv);v=JSON.stringify(o)}catch{}}return rawSet.call(this,k,v)};const of=window.fetch.bind(window);window.fetch=async function(input,init){let u=typeof input==='string'?input:(input&&input.url)||'';let opts=init?{...init}:{};const mv=cur();if(mv&&typeof opts.body==='string'&&opts.body.trim().startsWith('{'))try{const o=JSON.parse(opts.body);patchObj(o,mv);opts.body=JSON.stringify(o)}catch{}const res=await of(input,opts);if(mv&&/kobutsu-sync/.test(u)){try{const d=await res.clone().json();patchObj(d,mv);return new Response(JSON.stringify(d),{status:res.status,statusText:res.statusText,headers:res.headers})}catch{}}return res};function inMain(el){const meta=((el&&el.id)||'')+' '+((el&&el.name)||'')+' '+((el&&el.getAttribute&&el.getAttribute('data-key'))||'');if(/main.*category|primary.*category/i.test(meta))return true;let n=el;for(let i=0;i<6&&n;i++,n=n.parentElement){const t=(n.innerText||n.textContent||'').trim();if(t.length<1600&&/主として取り扱|主たる区分/.test(t))return true}return false}function valOf(t){let v='';if(t&&'value'in t)v=t.value||'';if(!canon(v)&&t){const lab=t.closest&&t.closest('label');v=(lab&&lab.innerText)||t.innerText||t.textContent||''}return canon(v)}function autosave(){setTimeout(()=>{const b=[...document.querySelectorAll('button,a')].find(x=>/クラウドへ今すぐ保存/.test((x.textContent||'').trim()));if(b)b.click()},120)}function onPick(e){const t=e.target;if(!t||!inMain(t))return;const v=valOf(t);if(!v)return;set(v);autosave()}document.addEventListener('change',onPick,true);document.addEventListener('click',onPick,true);window.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{document.querySelectorAll('*').forEach(el=>{if(el.children.length===0&&/v0\.12/.test(el.textContent||''))el.textContent=(el.textContent||'').replace(/v0\.12/g,'v0.17.2')})},300)});})();`;txt='<scr'+'ipt>'+patch+'</scr'+'ipt>'+txt;document.open();document.write(txt);document.close()}catch(e){document.getElementById('loading').textContent='申請画面を読み込めませんでした。再読み込みしてください。';console.error(e)}})();</script>
