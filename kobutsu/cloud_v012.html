<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOM 古物商申請アシスト</title><div id="loading" style="font-family:sans-serif;padding:40px;text-align:center">申請画面を読み込んでいます…</div><script>(async()=>{try{const base="https://raw.githubusercontent.com/TomZeroichi/tom-toolportal/main/kobutsu/";const names=['cloud_v012_1.txt', 'cloud_v012_2.txt', 'cloud_v012_3.txt', 'cloud_v012_4.txt', 'cloud_v012_5.txt'];const parts=await Promise.all(names.map(n=>fetch(base+n,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const bin=Uint8Array.from(atob(parts.join("").trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");const txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(txt);document.close()}catch(e){document.getElementById("loading").textContent="申請画面を読み込めませんでした。再読み込みしてください。";console.error(e)}})();</script>
